<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChikuiZone</title>


  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Libre Baskerville", serif;
    }

    body {
      background: #0d0d0d;
      color: #ffffff;
      overflow-x: hidden;
    }

  
    * {
      cursor: url('https://cdn.cursors-4u.net/previews/space-shuttle-dd2c77fb-32.webp') 32 32, auto !important;
    }

    header {
      position: fixed;
      width: 100%;
      top: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      padding: 15px;
      text-align: center;
      z-index: 10;
      border-bottom: 1px solid #1f1f1f;
    }

    header h1 {
      color: #24e367;
      font-size: 2.4rem;
      letter-spacing: 2px;
    }

    .tagline {
      margin-top: 100px;
      text-align: center;
      font-size: 1.1rem;
      color: #d9f0e5;
      text-shadow: 2px 2px 4px #000;
    }

    /* Background Video */
    video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -2;
      filter: brightness(0.4);
    }

    /* Overlay */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at top, rgba(36,227,103,0.15), transparent 60%);
      z-index: -1;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    .hero h2 {
      font-size: 3rem;
      margin-bottom: 20px;
      text-shadow: 2px 2px 10px #000;
    }

    .hero p {
      max-width: 650px;
      font-size: 1.15rem;
      color: #e0e0e0;
      margin-bottom: 40px;
      line-height: 1.6;
    }

    .hero button {
      padding: 15px 40px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 30px;
      background: linear-gradient(135deg, #00ffcc, #24e367);
      color: #000;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 20px rgba(36, 227, 103, 0.4);
    }

    .hero button:hover {
      transform: scale(1.08);
      box-shadow: 0 0 25px #00ffcc, 0 0 50px rgba(36,227,103,0.8);
    }

    footer {
      background: rgba(0, 0, 0, 0.8);
      text-align: center;
      padding: 15px;
      font-size: 0.85rem;
      color: #aaa;
      border-top: 1px solid #1f1f1f;
    }

    @media (max-width: 768px) {
      .hero h2 {
        font-size: 2.2rem;
      }
      .hero p {
        font-size: 1rem;
      }
    }
  </style>
</head>

<body>

  <video autoplay muted loop>
    <source src=".assets/battlefield.mp4" type="video/mp4">
  </video>

  <div class="overlay"></div>

  <header>
    <h1>ChikuiZone</h1>
  </header>

  <p class="tagline">A GAME ENTHUSIAST’S DESTINATION</p>

  <section class="hero">
    <h2>GET READY TO DOMINATE THE ARENA</h2>
    <p>
      Dawg in to explore your favorite games, latest updates, upcoming releases,
      and everything a true gamer needs.
    </p>
    <button onclick="location.href='secondpage.html'">DAWG IN</button>
  </section>

  <footer>
    © ChikuiZone | Designed with HTML & CSS
  </footer>

</body>
</html>
